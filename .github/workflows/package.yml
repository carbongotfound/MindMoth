name: Package extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python tools/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: mindmoth-extension
          path: dist/*.zip
